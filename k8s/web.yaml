apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: notes-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: katrinateer/notes-app:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: db-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: notes-lab
spec:
  selector:
    app: web
  ports:
    - port: 8000
      targetPort: 8000